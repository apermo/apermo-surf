name: 'Close stale issues and PRs'

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          # -1 is actions/stale's "never close" value: items are still
          # labelled stale, but they are never closed automatically.
          days-before-close: -1

          stale-issue-label: 'stale'
          stale-pr-label: 'stale'

          exempt-issue-labels: 'pinned,security,in-progress'
          exempt-pr-labels: 'dependencies,security,in-progress'

          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will not be closed automatically. If this issue is
            still relevant, please leave a comment to let us know.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not had
            recent activity. It will not be closed automatically. If this PR is
            still relevant, please leave a comment to let us know.

          operations-per-run: 30
